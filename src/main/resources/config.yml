# Валюты и их настройки
Valet:
  # Имя валюты (только латиница, цифры и _)
  coin:
    # Участвует ли валюта в обмене (пары настраиваются в секции Convert)
    can_convert: true
    # Лимит валюты для игрока
    limit: 100000000
  valet23:
    can_convert: true
    limit: 100000000

# Обмен валют: /convert <из> <в> <сумма>, курсы: /convert rate
Convert:
  # Комиссия по умолчанию, % (можно переопределить в паре через fee-percent)
  fee-percent: 0
  # Пары задаются НАПРАВЛЕННО в виде <из>-<в>. Обратный обмен нужно описать отдельной парой.
  # Курс = сколько единиц валюты "в" даётся за 1 единицу валюты "из".
  # Чтобы нельзя было зарабатывать на обмене туда-обратно, произведение курсов встречных пар
  # (с учётом max-rate и комиссий) должно быть не больше 1 — плагин предупредит в консоли.
  pairs:
    coin-valet23:
      # FIXED — постоянный курс
      mode: FIXED
      rate: 10
    valet23-coin:
      # DYNAMIC — курс меняется от количества валюты и частоты обменов
      mode: DYNAMIC
      # Базовый курс и границы, в которых он может колебаться
      rate: 0.09
      min-rate: 0.05
      max-rate: 0.1
      fee-percent: 1
      supply:
        # "Нормальное" общее количество валюты "в" (coin) у всех игроков.
        # Больше нормы -> валюта дешевеет -> за 1 "из" дают больше; меньше нормы -> наоборот.
        reference: 1000000
        # Сила влияния (0 — выключено). При reference*2 курс изменится примерно на sensitivity*100%
        sensitivity: 0.5
      demand:
        # За какой период считаем обмены В валюту "в" (минуты, максимум 43200)
        window-minutes: 60
        # Нормальное число обменов в эту валюту за период
        reference-ops: 20
        # Сила влияния (0 — выключено). Частые обмены удорожают валюту "в" -> курс падает
        sensitivity: 0.5

# База данных
Database:
  # Строка подключения. Примеры:
  #   jdbc:sqlite:plugins/InfValets/data.db
  #   jdbc:postgresql://localhost:5432/db?user=USER&password=PASS
  url: 'jdbc:sqlite:plugins/InfValets/data.db'

# Интеграция с Vault (необязательна: плагин работает и без него)
Vault:
  # Регистрировать Economy-провайдер, если на сервере есть Vault
  enabled: true
  # Валюта, с которой будет работать Vault (по умолчанию — первая из секции Valet)
  valet: coin
  # Название валюты (для Vault-плагинов: магазины, /baltop и т.д.)
  name-singular: 'монета'
  name-plural: 'монет'

Messages:
  prefix: '&7[&6InfValetsVH&7]'
  Errors:
    not-permission: '&cНедостаточно прав!'
    database: '&cОшибка базы данных. Сообщите администрации!'
    player-not-found: '&cИгрок не найден!'
    unknown-valet: '&cТакой валюты не существует!'
    invalid-amount: '&cУкажите корректную сумму!'
    only-players: '&cЭту команду может использовать только игрок!'
    not-enough: '&cНедостаточно средств!'
    limit-reached: '&cПревышен лимит валюты!'
    pay-self: '&cНельзя перевести деньги самому себе!'
    cancelled: '&cОперация отменена.'
    convert-unavailable: '&cТакой обмен недоступен!'
    convert-too-small: '&cСумма слишком мала: вы бы получили 0.'
    unknown-costcommand: '&cТакой платной команды нет!'
  usage-balance: '&7Использование: &e/balance <игрок|валюта|top>'
  usage-top: '&7Использование: &e/balance top <валюта>'
  usage-admin: '&7Использование: &e/balance <give|take|set> <игрок> <валюта> <сумма>'
  usage-costcommand: '&7Использование: &e/costcommands <название>'
  usage-eco: '&7Использование: &e/eco <give|take|set|reset> <игрок> [валюта] <сумма>'
  usage-infvalets: '&7Использование: &e/infvalets reload'
  reload-done: '&aКонфигурация перезагружена.'
  usage-convert: '&7Использование: &e/convert <из> <в> <сумма> &7или &e/convert rate [из] [в]'
  convert-done: '&aОбмен: &e%from_amount% %from% &a-> &e%to_amount% %to% &7(курс %rate%)'
  convert-rate-header: '&6Курсы обмена:'
  convert-rate: '&7Курс: &e1 %from% &7= &e%rate% %to%'
  usage-pay: '&7Использование: &e/pay <игрок> [валюта] <сумма>'
  # Плейсхолдеры: %player% %valet% %amount% %pos%
  balance-header: '&6В вашем кошельке:'
  balance-header-other: '&6Кошелёк игрока &e%player%&6:'
  balance-line: '&e%valet% &7- &a%amount%'
  top-header: '&6Топ по валюте &e%valet%&6:'
  top-line: '&7%pos%. &e%player% &7- &a%amount%'
  top-empty: '&7Пока никого нет.'
  admin-give: '&aИгроку &e%player% &aвыдано &e%amount% %valet%'
  admin-take: '&aУ игрока &e%player% &aсписано &e%amount% %valet%'
  admin-set: '&aБаланс игрока &e%player% &aв &e%valet% &aтеперь &e%amount%'
  pay-sent: '&aВы перевели &e%amount% %valet% &aигроку &e%player%'
  cost-paid: '&aСписано &e%amount% %valet%'
  pay-received: '&aИгрок &e%player% &aперевёл вам &e%amount% %valet%'

# Платные команды: /costcommands <название>
CostCommands:
  # Название команды
  say-hello:
    # Стоимость исполнения команды
    cost: 100
    # Валюта списания (можно не указывать, если валюта в плагине одна)
    valet: coin
    # Тип исполнения команд
    # SERVER = исполняет команды от имени сервера
    # PLAYER = исполняет команды от именя игрока
    type: SERVER
    # Список исполняемых команд (без ведущего "/")
    # Поддерживаемые заполнители:
    # $player = подставляет имя игрока
    commands:
      - 'broadcast &aИгрок: &6$player &aактивировал команду!'
      - 'say &6$player &aПроверил команду!'
